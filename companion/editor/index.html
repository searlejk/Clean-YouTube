<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Swear Editor</title>
<style>
  :root {
    --bg: #ffffff; --fg: #111; --muted: #666; --line: #e3e3e3; --field: #f4f4f5;
    --accent: #c4302b; --ok: #1f9d55; --warn: #b45309; --sel: #fde8e7;
    --word: #e7e7ea; --sub: rgba(31, 157, 85, .28); --cut: rgba(196, 48, 43, .25);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #18181b; --fg: #f1f1f1; --muted: #a1a1aa; --line: #333; --field: #27272a; --accent: #ff5a4f; --ok: #3ecf8e; --warn: #f59e0b; --sel: #3a1f1e; --word: #34343a; --sub: rgba(62, 207, 142, .3); --cut: rgba(255, 90, 79, .28); }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; }
  header select { margin-left: auto; max-width: 50%; }
  main { display: grid; grid-template-columns: minmax(240px, 320px) 1fr; height: calc(100vh - 49px); }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; height: auto; } }
  #list { overflow: auto; border-right: 1px solid var(--line); }
  .item { display: grid; grid-template-columns: 44px 1fr; gap: 2px 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:hover { background: var(--field); }
  .item.sel { background: var(--sel); }
  .item .t { color: var(--muted); font-variant-numeric: tabular-nums; }
  .item .w b { color: var(--accent); }
  .item .s { grid-column: 2; color: var(--muted); font-size: 12px; }
  #panel { overflow: auto; padding: 16px 20px 40px; max-width: 900px; }
  h2 { margin: 0 0 4px; font-size: 18px; }
  .info { font-size: 12px; color: var(--muted); }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
  .bar label { display: flex; align-items: center; gap: 6px; color: var(--muted); }

  /* timeline */
  .tl { position: relative; height: 92px; margin: 14px 0 6px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
  .tl .w { position: absolute; top: 34px; height: 30px; background: var(--word); border-radius: 5px; font-size: 12px; line-height: 30px; padding: 0 4px; overflow: hidden; white-space: nowrap; text-overflow: clip; }
  .tl .w.swear { background: var(--accent); color: #fff; font-weight: 600; }
  .tl .w.cut { outline: 2px solid var(--accent); outline-offset: -2px; }
  .tl .gap { position: absolute; top: 6px; bottom: 6px; background: var(--sub); border: 2px solid var(--ok); border-radius: 6px; }
  .tl .gap span { position: absolute; top: 2px; left: 6px; font-size: 12px; font-weight: 600; color: var(--ok); white-space: nowrap; }
  .tl .say { position: absolute; bottom: 8px; height: 6px; background: var(--ok); border-radius: 3px; }
  .tl .tick { position: absolute; bottom: 0; font-size: 10px; color: var(--muted); transform: translateX(-50%); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
  .fit { margin: 6px 0 2px; font-weight: 600; }
  .fit.ok { color: var(--ok); }
  .fit.bad { color: var(--warn); }

  /* main dials */
  .dial { display: grid; grid-template-columns: 170px 1fr 90px; gap: 10px; align-items: center; margin: 12px 0; }
  .dial .ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .dial output { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
  .dial input[type=range] { width: 100%; }
  input[type=text] { font: inherit; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--field); color: var(--fg); width: 100%; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 6px 12px; }
  .seg button.on { background: var(--accent); color: #fff; }
  details { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 10px; }
  summary { cursor: pointer; font-weight: 600; }
  .group { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  .group.off > .body { opacity: .4; pointer-events: none; }
  .group h3 { margin: 0; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .group h3 .hint { font-weight: normal; color: var(--muted); font-size: 12px; }
  .body { margin-top: 8px; display: grid; gap: 8px; }
  .switch { position: relative; width: 34px; height: 20px; flex: none; display: inline-block; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 20px; transition: .15s; }
  .switch span::after { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; border-radius: 50%; background: #fff; transition: .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(14px); }
  .pieces { display: grid; gap: 4px; max-height: 160px; overflow: auto; }
  .piece { display: grid; grid-template-columns: auto auto 1fr; gap: 8px; align-items: center; font-size: 12px; }
  .status { min-height: 1.4em; color: var(--muted); }
  .status.err { color: var(--accent); }
  .busy { color: var(--warn); }
</style>
</head>
<body>
<header>
  <h1>Swear editor</h1>
  <span class="info">Make each substitute sound right in the speaker's voice</span>
  <select id="project"></select>
</header>
<main>
  <div id="list"></div>
  <div id="panel"><p class="info">Pick a swear on the left.</p></div>
</main>
<audio id="player"></audio>
<script>
const $ = (s, el = document) => el.querySelector(s);
const fmt = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
let P = null, pid = null, cur = null, last = null, settings = {}, autoPlay = true, busy = false, pending = false;
const player = $('#player');

// Same rules as companion/voice_clone.py estimate_seconds and editor_audio.py plan().
function naturalSeconds(text) {
  const words = (text.toLowerCase().match(/[a-z']+/g) || []);
  const syll = words.reduce((n, w) => n + Math.max(1, (w.match(/[aeiouy]+/g) || []).length), 0);
  return 0.12 + 0.2 * syll;
}
function planGap(sw, s) {
  const swearLen = sw.end - sw.start;
  const want = naturalSeconds(s.say || sw.say) / Math.max(0.3, s.speed || 1);
  const allow = s.allowed ? Math.max(0.15, s.allowed) : Math.max(swearLen, want);
  const extra = allow - swearLen;
  let g0, g1;
  if (extra <= 0) [g0, g1] = [sw.start, sw.start + allow];
  else if (s.take === 'before') [g0, g1] = [sw.end - allow, sw.end];
  else if (s.take === 'both') [g0, g1] = [sw.start - extra / 2, sw.end + extra / 2];
  else [g0, g1] = [sw.start, sw.start + allow];
  g0 = Math.max(0, g0);
  return { g0, g1, word: Math.min(want, g1 - g0), want, allow, squeezed: want > g1 - g0 + 0.02 };
}

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

async function loadProjects() {
  const list = await api('/api/projects');
  $('#project').innerHTML = list.map((p) => `<option value="${p.id}">${p.title}</option>`).join('');
  if (list.length) loadProject(list[0].id);
  else $('#panel').innerHTML = '<p class="info">No projects yet: run companion/offline.py on a downloaded video.</p>';
}

async function loadProject(id) {
  pid = id;
  P = await api('/api/project?id=' + encodeURIComponent(id));
  $('#list').innerHTML = P.swears.map((s, i) => `
    <div class="item" data-i="${i}">
      <div class="t">${fmt(s.start)}</div>
      <div class="w"><b>${s.swear}</b> → ${s.say}</div>
      <div class="s">speaker ${s.speaker == null ? '?' : s.speaker + 1}${s.phrase ? ' · “' + s.phrase + '”' : ''}</div>
    </div>`).join('');
  $('#list').onclick = (e) => { const it = e.target.closest('.item'); if (it) select(+it.dataset.i); };
  if (P.swears.length) select(0);
}

function select(i) {
  cur = i; last = null;
  document.querySelectorAll('.item').forEach((el) => el.classList.toggle('sel', +el.dataset.i === i));
  const s = P.swears[i];
  settings = { ...P.defaults, ...(P.presets[String(s.speaker)] || {}), say: s.say, ref_pieces: null, allowed: null };
  render();
}

// ───── layout ─────
function render() {
  const sw = P.swears[cur];
  const voice = P.voices[sw.speaker];
  $('#panel').innerHTML = `
    <h2>${fmt(sw.start)} · “${sw.swear}” → <span id="title-say">“${settings.say}”</span></h2>
    <div class="info">speaker ${sw.speaker == null ? 'unknown' : sw.speaker + 1} · voice sample ${voice ? voice.seconds + ' s' : 'none'}</div>

    <div id="timeline" class="tl"></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>the swear</span><span><i style="background:var(--sub);border:2px solid var(--ok)"></i>time given to the substitute</span><span><i style="background:var(--ok)"></i>how long it will speak</span><span><i style="outline:2px solid var(--accent);background:var(--word)"></i>neighbouring word that gets covered</span></div>
    <div id="fit" class="fit"></div>

    <div class="dial"><span>Substitute word</span><input type="text" id="say" value="${settings.say}"><span></span></div>
    <div class="dial"><span>Speaking speed</span>
      <div><input type="range" id="speed" min="0.5" max="1.8" step="0.05" value="${settings.speed}"><div class="ends"><span>slower</span><span>normal</span><span>faster</span></div></div>
      <output id="speed-out"></output></div>
    <div class="dial"><span>Time for the substitute</span>
      <div><input type="range" id="allowed" min="0.15" max="2.5" step="0.05" value="${settings.allowed || planGap(sw, settings).allow}"><div class="ends"><span>less time</span><span>more time →</span></div></div>
      <output id="allowed-out"></output></div>
    <div class="info" style="margin:-6px 0 6px 180px">Time beyond the swear is taken from the words around it (they get covered).</div>
    <div class="dial"><span>Take extra time from</span>
      <div class="seg" id="take">${['before', 'both', 'after'].map((k) => `<button data-take="${k}" class="${settings.take === k ? 'on' : ''}">${k === 'both' ? 'both sides' : 'words ' + k}</button>`).join('')}</div>
      <button id="auto-time" title="Give it exactly the time it needs at this speed">Auto</button></div>

    <div class="bar">
      <button id="b-orig">▶ Original</button>
      <button id="b-sub" ${last ? '' : 'disabled'}>▶ Substitute</button>
      <button id="b-word" ${last ? '' : 'disabled'}>▶ Word only</button>
      <button id="b-gen" class="primary">Regenerate</button>
      <label><input type="checkbox" id="autoplay" ${autoPlay ? 'checked' : ''}> regenerate &amp; play when I let go of a dial</label>
      <button id="b-save" ${sw.speaker == null ? 'disabled' : ''}>Save for speaker ${sw.speaker == null ? '' : sw.speaker + 1}</button>
    </div>
    <div id="status" class="status">${last ? infoText(last) : 'Drag the dials: the timeline shows what will happen. Let go to hear it.'}</div>

    <details><summary>More: voice, pitch, tone, loudness, quality</summary>${moreHtml(voice ? voice.pieces : [])}</details>`;
  bind();
  updatePreview();
}

function moreHtml(pieces) {
  const g = (key, title, hint, inner) => `<div class="group ${settings[key] ? '' : 'off'}"><h3><label class="switch"><input type="checkbox" data-on="${key}" ${settings[key] ? 'checked' : ''}><span></span></label>${title} <span class="hint">${hint}</span></h3><div class="body">${inner}</div></div>`;
  const r = (id, label, min, max, step, unit, ends) => `<div class="dial"><span>${label}</span><div><input type="range" data-k="${id}" min="${min}" max="${max}" step="${step}" value="${settings[id]}">${ends ? `<div class="ends"><span>${ends[0]}</span><span>${ends[1]}</span></div>` : ''}</div><output data-out="${id}">${(+settings[id]).toFixed(2).replace(/\.?0+$/, '')}${unit}</output></div>`;
  const pc = pieces.length ? `<div class="info">Or tick exactly which stretches of their real speech to copy:</div><div class="pieces">${pieces.map((p, j) => `<div class="piece"><input type="checkbox" data-piece="${j}" ${settings.ref_pieces && settings.ref_pieces.some(([a]) => Math.abs(a - p.start) < 0.01) ? 'checked' : ''}><button data-play="${j}">▶</button><span>${fmt(p.start)} · ${(p.end - p.start).toFixed(1)} s</span></div>`).join('')}</div>` : '';
  return g('ref_on', 'Voice reference', 'how much of their real speech the model copies', r('ref_seconds', 'Reference length', 3, 10, 0.5, ' s', ['shorter', 'longer']) + pc)
    + g('pitch_on', 'Pitch', 'make the voice lower or higher', r('pitch', 'Pitch', -5, 5, 0.5, ' st', ['lower', 'higher']))
    + g('tone_on', 'Tone match', 'copy the brightness of the original swear', r('tone', 'Strength', 0, 1, 0.05, '', ['subtle', 'strong']))
    + g('loud_on', 'Loudness', 'matched to the original, then adjust', r('loud_db', 'Volume', -9, 9, 0.5, ' dB', ['quieter', 'louder']))
    + g('quality_on', 'Quality', 'more steps: slower to make, cleaner sound', r('steps', 'Steps', 8, 64, 4, '', ['fast', 'best']));
}

// ───── live preview of timing ─────
function updatePreview() {
  const sw = P.swears[cur];
  const pl = planGap(sw, settings);
  $('#speed-out').textContent = (+settings.speed).toFixed(2) + '×';
  $('#allowed-out').textContent = (settings.allowed ? pl.allow.toFixed(2) : pl.allow.toFixed(2) + ' (auto)') + ' s';
  const sl = $('#allowed');
  if (!settings.allowed) sl.value = pl.allow;
  // Timeline window: 1.5 s either side of everything involved.
  const t0 = Math.min(pl.g0, sw.start) - 1.5, t1 = Math.max(pl.g1, sw.roomEnd) + 1.5;
  const x = (t) => ((t - t0) / (t1 - t0)) * 100;
  const words = P.words.filter((w) => w.end > t0 && w.start < t1);
  const cutWords = [];
  const html = words.map((w) => {
    const isSwear = w.start >= sw.start - 0.02 && w.end <= sw.end + 0.02;
    const cut = !isSwear && w.start < pl.g1 && w.end > pl.g0;
    if (cut) cutWords.push(w.text);
    return `<div class="w ${isSwear ? 'swear' : ''} ${cut ? 'cut' : ''}" style="left:${x(w.start)}%;width:${Math.max(0.5, x(w.end) - x(w.start))}%" title="${w.text}">${w.text}</div>`;
  }).join('');
  const ticks = [];
  for (let t = Math.ceil(t0 * 2) / 2; t < t1; t += 0.5) ticks.push(`<div class="tick" style="left:${x(t)}%">${t.toFixed(1)}</div>`);
  $('#timeline').innerHTML = html + `<div class="gap" style="left:${x(pl.g0)}%;width:${x(pl.g1) - x(pl.g0)}%"><span>“${settings.say}” ${pl.allow.toFixed(2)} s</span></div><div class="say" style="left:${x(pl.g0)}%;width:${x(pl.g0 + pl.word) - x(pl.g0)}%"></div>` + ticks.join('');
  const fit = $('#fit');
  if (pl.squeezed) {
    fit.className = 'fit bad';
    fit.textContent = `“${settings.say}” needs ${pl.want.toFixed(2)} s at this speed but only gets ${pl.allow.toFixed(2)} s, so it will be said faster. Give it more time or speed it up.`;
  } else {
    fit.className = 'fit ok';
    fit.textContent = `“${settings.say}” fits: ${pl.want.toFixed(2)} s of speech in ${pl.allow.toFixed(2)} s.` + (cutWords.length ? ` Covers: ${cutWords.join(' ')}` : '');
  }
}

// ───── controls ─────
function bind() {
  const sw = P.swears[cur];
  const pieces = (P.voices[sw.speaker] || {}).pieces || [];
  const changed = () => { if (autoPlay) regenerate(); };
  $('#say').oninput = (e) => { settings.say = e.target.value; $('#title-say').textContent = `“${settings.say}”`; updatePreview(); };
  $('#say').onchange = changed;
  $('#speed').oninput = (e) => { settings.speed = +e.target.value; updatePreview(); };
  $('#speed').onchange = changed;
  $('#allowed').oninput = (e) => { settings.allowed = +e.target.value; updatePreview(); };
  $('#allowed').onchange = changed;
  $('#take').onclick = (e) => {
    const b = e.target.closest('[data-take]'); if (!b) return;
    settings.take = b.dataset.take;
    document.querySelectorAll('[data-take]').forEach((x) => x.classList.toggle('on', x === b));
    updatePreview(); changed();
  };
  $('#auto-time').onclick = () => { settings.allowed = null; updatePreview(); changed(); };
  $('#autoplay').onchange = (e) => (autoPlay = e.target.checked);
  $('#b-orig').onclick = playOriginal;
  $('#b-sub').onclick = () => playRendered('context');
  $('#b-word').onclick = () => playRendered('word');
  $('#b-gen').onclick = regenerate;
  $('#b-save').onclick = savePreset;
  document.querySelectorAll('[data-on]').forEach((el) => (el.onchange = () => { settings[el.dataset.on] = el.checked; el.closest('.group').classList.toggle('off', !el.checked); changed(); }));
  document.querySelectorAll('[data-k]').forEach((el) => {
    el.oninput = () => { settings[el.dataset.k] = +el.value; const o = document.querySelector(`[data-out="${el.dataset.k}"]`); if (o) o.textContent = (+el.value).toFixed(2).replace(/\.?0+$/, '') + o.textContent.replace(/^[-\d.]+/, ''); };
    el.onchange = changed;
  });
  document.querySelectorAll('[data-piece]').forEach((el) => (el.onchange = () => {
    const chosen = [...document.querySelectorAll('[data-piece]:checked')].map((c) => pieces[+c.dataset.piece]);
    settings.ref_pieces = chosen.length ? chosen.map((p) => [p.start, p.end]) : null;
    changed();
  }));
  document.querySelectorAll('[data-play]').forEach((el) => (el.onclick = () => { const p = pieces[+el.dataset.play]; playUrl(`/api/audio?id=${pid}&track=vocals&start=${p.start}&end=${p.end}`); }));
}

function infoText(r) {
  const i = r.info;
  if (i.why) return i.why;
  return `Made “${i.say}” (${i.seconds} s of speech) in ${r.seconds} s · ${i.steps} steps · copied from ${i.reference.seconds} s of their speech${i.squeezed ? ' · said faster to fit' : ''}`;
}
function setStatus(t, cls) { const el = $('#status'); el.textContent = t; el.className = 'status ' + (cls || ''); }
function playUrl(u) { player.src = u; player.play(); }
function playOriginal() {
  const sw = P.swears[cur];
  const pl = planGap(sw, settings);
  playUrl(`/api/audio?id=${pid}&track=mix&start=${Math.max(0, Math.min(pl.g0, sw.start) - 2)}&end=${Math.max(pl.g1, sw.roomEnd) + 2}`);
}
function playRendered(which) { if (last) playUrl(`/api/rendered?rid=${last.rid}&which=${which}`); }

async function regenerate() {
  if (busy) { pending = true; return; }
  busy = true;
  setStatus('Making the substitute…', 'busy');
  $('#b-gen').disabled = true;
  try {
    const sw = P.swears[cur];
    last = await api('/api/render', { id: pid, index: cur, settings });
    if (P.swears[cur] === sw) {
      $('#b-sub').disabled = false; $('#b-word').disabled = false;
      setStatus(infoText(last));
      if (!pending) playRendered('context');
    }
  } catch (e) {
    setStatus('Failed: ' + e.message, 'err');
  } finally {
    busy = false;
    const b = $('#b-gen'); if (b) b.disabled = false;
    if (pending) { pending = false; regenerate(); }
  }
}

async function savePreset() {
  const sw = P.swears[cur];
  const { say, ref_pieces, ...keep } = settings;
  const r = await api('/api/presets', { id: pid, speaker: sw.speaker, settings: keep });
  P.presets = r.presets;
  setStatus(`Saved as speaker ${sw.speaker + 1}'s settings for this video.`);
}

$('#project').onchange = (e) => loadProject(e.target.value);
loadProjects().catch((e) => ($('#panel').innerHTML = `<p class="status err">${e.message}</p>`));
</script>
</body>
</html>
