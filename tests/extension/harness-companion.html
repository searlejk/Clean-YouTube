<!doctype html>

<title>Extension harness with companion</title>
<!-- Like harness.html, but the content script's port goes to the real
     offscreen.js in this page, which talks to a companion app on
     127.0.0.1:47823. Start one for testing with:
       companion/.venv/bin/python companion/server.py --allow-local-test-pages
     Open with #cleanears-silent-test: the extension's audio has no output device. -->

  video { position: absolute; left: 0; top: 0; width: 640px; height: 120px; }
</style>

<div id="movie_player" class="html5-video-player"><div class="html5-video-container"><video class="html5-main-video" playsinline></video></div></div>
